services:
  web:
    build: .
    container_name: clinicdesk-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: clinicdesk_db
      DB_USER: clinicdesk
      DB_PASS: clinicdesk_pass
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: clinicdesk-db
    environment:
      MARIADB_DATABASE: clinicdesk_db
      MARIADB_USER: clinicdesk
      MARIADB_PASSWORD: clinicdesk_pass
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
